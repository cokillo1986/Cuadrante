<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta</title>
<style>
body{margin:0;font-family:'Segoe UI',Arial;background:#f0f2f5;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:12px;padding:28px 22px;box-shadow:0 4px 20px rgba(0,0,0,.12);width:100%;max-width:400px;text-align:center}
h1{color:#1877F2;font-size:34px;margin:0 0 22px}
input{width:100%;padding:15px 14px;border-radius:8px;border:1px solid #ccd0d5;font-size:16px;margin:0 0 12px;box-sizing:border-box;outline:none}
input:focus{border-color:#1877F2;box-shadow:0 0 0 2px rgba(24,119,242,.2)}
button{width:100%;padding:14px;border:none;border-radius:8px;background:#1877F2;color:#fff;font-weight:800;font-size:18px;cursor:pointer;margin-top:8px}
.small{font-size:12px;color:#65676b;margin-top:14px;line-height:1.4}
#msg{display:none;color:#1877F2;font-weight:700;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>Crear cuenta</h1>
<form id="f">
<input name="Nombre" placeholder="Tu nombre" required>
<input name="Apellidos" placeholder="Tus apellidos" required>
<button type="submit">Registrarse</button>
<p id="msg">✅ Enviado correctamente</p>
</form>
<p class="small">Al registrarte aceptas nuestros Términos y Política de Privacidad</p>
</div>

<script>
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  
  // 👇 PEGA AQUÍ TU URL /exec DE APPS SCRIPT
  const URL = "PEGA_AQUI_TU_URL_EXEC";

  if(URL.includes("PEGA_AQUI")){
    alert("Te falta pegar tu URL de Apps Script");
    return;
  }

  await fetch(URL, {method:'POST', body: new FormData(e.target), mode:'no-cors'});
  document.getElementById('msg').style.display='block';
  e.target.reset();
});
</script>
</body>
</html>

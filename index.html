<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Partes</title>
<style>
  *{box-sizing:border-box}
  body{font-family:sans-serif;background:#0f1115;color:white;padding:12px;margin:0}
  input,button{padding:12px;border-radius:12px;border:none;font-size:15px}
  input{width:100%;background:#1e2230;color:white;margin-bottom:8px}
  .btn-add{background:#0a0a0a;color:white;width:100%;font-weight:bold;border:1px solid #333}
  .card{background:white;color:#111;border-radius:20px;padding:16px;margin:14px 0}
  .barra{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:8px 0}
  .relleno{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444)}
  .row{display:flex;gap:8px}
  .mas{flex:1;background:#ef4444;color:white;font-weight:bold}
  .menos{flex:1;background:#16a34a;color:white;font-weight:bold}
  .borrar{width:100%;background:#eef2f7;margin-top:8px}
  .historial{margin-top:10px;background:#f8fafc;border-radius:12px;padding:10px;font-size:14px}
  .parte-item{border-bottom:1px solid #e5e7eb;padding:8px 0}
  .parte-item:last-child{border:none}
  .fecha{font-weight:bold;font-size:13px;color:#444}
  .motivo{margin-top:2px}
  .btn-hist{background:#111;color:white;width:100%;margin-top:8px}
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:99}
  .modal.show{display:flex}
  .caja{background:white;color:#111;width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:18px}
  textarea{width:100%;height:90px;border-radius:12px;padding:12px;font-size:15px;border:1px solid #ccc}
</style>
</head>
<body>

<input id="buscador" placeholder="🔍 Buscar por nombre..." oninput="render()">
<button class="btn-add" onclick="anadirAlumno()">Añadir norma</button>
<p id="contador"></p>
<div id="lista"></div>

<!-- VENTANA PARA PONER EL MOTIVO -->
<div id="modal" class="modal">
  <div class="caja">
    <h3 style="margin:0 0 8px">Nuevo parte para <span id="nombreModal"></span></h3>
    <p id="fechaAuto" style="font-size:13px;color:#555"></p>
    <label><b>¿Por qué es el parte?</b></label>
    <textarea id="motivoInput" placeholder="Ej: Ha interrumpido la clase 3 veces..."></textarea>
    <div class="row" style="margin-top:10px">
      <button onclick="cerrarModal()" style="flex:1;background:#e5e7eb">Cancelar</button>
      <button onclick="guardarParte()" style="flex:1;background:#ef4444;color:white;font-weight:bold">Guardar parte</button>
    </div>
  </div>
</div>

<script>
let alumnos = JSON.parse(localStorage.getItem('partes_v2') || '[]');
let alumnoActual = null;

if(alumnos.length===0){
  alumnos = [
    {nombre:'Erika', curso:'10 años', partes:[{fecha:'08/11/2026', dia:'Domingo', hora:'18:00', motivo:'Ejemplo de parte'}]},
    {nombre:'Gissela', curso:'16 años', partes:[]}
  ];
  // Para que en tu caso empiece en 4 y 2 como en la foto, descomenta esto si quieres, si no déjalo en 0
  // Erika ya tiene 1 de ejemplo, añade el resto si quieres
  guardar();
}

function guardar(){ localStorage.setItem('partes_v2', JSON.stringify(alumnos)); }

function anadirAlumno(){
  let n = prompt('Nombre del alumno:');
  if(!n) return;
  let c = prompt('Curso / edad:','');
  alumnos.push({nombre:n, curso:c, partes:[]});
  guardar(); render();
}

function abrirModal(i){
  alumnoActual = i;
  let ahora = new Date();
  let dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  let textoFecha = dias[ahora.getDay()] + ' ' + ahora.toLocaleDateString('es-ES') + ' - ' + ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('nombreModal').innerText = alumnos[i].nombre;
  document.getElementById('fechaAuto').innerText = textoFecha;
  document.getElementById('motivoInput').value = '';
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('motivoInput').focus(),100);
}
function cerrarModal(){ document.getElementById('modal').classList.remove('show'); }

function guardarParte(){
  let motivo = document.getElementById('motivoInput').value.trim();
  if(!motivo){ alert('Pon el motivo del parte'); return; }
  let ahora = new Date();
  let dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  alumnos[alumnoActual].partes.push({
    dia: dias[ahora.getDay()],
    fecha: ahora.toLocaleDateString('es-ES'),
    hora: ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
    motivo: motivo
  });
  guardar(); cerrarModal(); render();
}

function quitarParte(i){
  if(alumnos[i].partes.length===0) return;
  if(confirm('¿Quitar el último parte de '+alumnos[i].nombre+'?')){
    alumnos[i].partes.pop(); guardar(); render();
  }
}
function borrarAlumno(i){
  if(confirm('¿Borrar a '+alumnos[i].nombre+'?')){ alumnos.splice(i,1); guardar(); render(); }
}
function toggleHist(i){
  let el = document.getElementById('hist-'+i);
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

function render(){
  let filtro = document.getElementById('buscador').value.toLowerCase();
  let html = '';
  let filtrados = alumnos.filter(a=>a.nombre.toLowerCase().includes(filtro));
  document.getElementById('contador').innerText = '🧑‍🎓 ' + filtrados.length + ' nombres';
  filtrados.forEach((a, idx)=>{
    let i = alumnos.indexOf(a);
    let total = a.partes.length;
    let pct = Math.min(total/5*100,100);
    let aviso = total>=4 ? '<p>⚠️ ¡Cuidado! Le falta '+(5-total)+' para quedarse sin privilegios</p>' : total>0 ? `<p>${total} partes acumuladas</p>` : '<p>Sin partes</p>';
    let hist = a.partes.map(p=>`<div class="parte-item"><div class="fecha">${p.dia} ${p.fecha} - ${p.hora}</div><div class="motivo">${p.motivo}</div></div>`).reverse().join('') || 'Sin partes todavía';
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between"><div><b style="font-size:19px">${a.nombre}</b><br><small>Curso: ${a.curso}</small></div><div>✅ TIENE</div></div>
      <div style="font-size:32px;font-weight:bold">${total} <span style="font-size:18px">/ 5 partes</span></div>
      <div class="barra"><div class="relleno" style="width:${pct}%"></div></div>
      ${aviso}
      <div class="row"><button class="mas" onclick="abrirModal(${i})">+1 Parte</button><button class="menos" onclick="quitarParte(${i})">-1 Parte</button></div>
      <button class="btn-hist" onclick="toggleHist(${i})">📋 Ver historial (${total})</button>
      <div id="hist-${i}" class="historial" style="display:none">${hist}</div>
      <button class="borrar" onclick="borrarAlumno(${i})">🗑️ Borrar nombre</button>
    </div>`;
  });
  document.getElementById('lista').innerHTML = html;
}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadrante Pro Final - Tareas del Hogar</title>
<style>
:root{--navy:#1a2f47;--teal:#0f766e;--yellow:#fbbf24;--bg:#eef1f4;--line:#dbe1e8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#1e293b}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#cbd5e1;font-size:14px}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;font-size:14px}
.btn-navy{background:var(--navy);color:#fff}.btn-teal{background:var(--teal);color:#fff}.btn-yellow{background:var(--yellow)}.btn-ghost{background:#fff;border:1px solid var(--line)}.btn-red{background:#e5484d;color:#fff}
.wrap{max-width:1280px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
label{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px;font-size:15px;font-family:inherit}
textarea{min-height:76px}.row{display:flex;gap:8px}.row>*{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.kpi b{font-size:26px;display:block}
.person{display:flex;justify-content:space-between;align-items:center;background:#f1f5f9;border-radius:12px;padding:10px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
table{width:100%;border-collapse:collapse}th{background:var(--navy);color:#fff;padding:12px;font-size:13px}td{border:1px solid var(--line);padding:10px;vertical-align:top}
td.day{font-weight:900;text-align:center;background:#fef9c3;width:110px}
.task{border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid #fde68a;background:#fffbeb}
.task.done{opacity:.65;background:#ecfdf5}.task.done .txt{text-decoration:line-through}
.task .txt{font-size:14px;display:block;margin:4px 0}.mini{padding:6px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.badge{font-size:11px;background:#0f766e;color:#fff;padding:4px 10px;border-radius:99px}
.chip{display:inline-block;background:#eef2ff;padding:7px 12px;border-radius:99px;margin:3px;font-size:13px;cursor:pointer;border:1px solid #c7d2fe}
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:99}
/* VISTA PREVIA */
#previewOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;overflow:auto;padding:20px}
#previewBox{background:#fff;max-width:1000px;margin:auto;border-radius:12px;overflow:hidden}
#previewBar{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0}
#previewContent{padding:18px}
#previewContent table{font-size:13px}#previewContent td{padding:8px}
#previewContent .task{font-size:13px}
@media print{body *{visibility:hidden}#previewBox,#previewBox *{visibility:visible}#previewBox{position:absolute;inset:0;max-width:none;margin:0;border-radius:0}#previewBar{display:none!important}#previewOverlay{display:block!important;position:static;padding:0;background:#fff}}
</style>
</head>
<body>
<header>
<div><h1>🏠 Cuadrante Pro · Tareas del Hogar</h1><p>Gisela • José Ángel • Erika — Organización, colaboración y responsabilidad</p></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-yellow" onclick="openPreview()">👀 Vista previa</button>
<button class="btn btn-teal" onclick="openPreview(true)">🖨 Imprimir</button>
<button class="btn btn-ghost" onclick="exportData()">⬇ Exportar</button>
<button class="btn btn-ghost" onclick="document.getElementById('file').click()">⬆ Importar</button>
<input type="file" id="file" hidden accept=".json" onchange="importData(event)">
<button class="btn btn-ghost" onclick="resetAll()">↺ Reiniciar</button>
</div>
</header>

<div class="wrap">
<div class="kpis">
<div class="kpi"><b id="kTotal">0</b><span>Tareas semana</span></div>
<div class="kpi"><b id="kDone">0</b><span>Completadas</span></div>
<div class="kpi"><b id="kPct">0%</b><span>Progreso</span></div>
</div>

<div class="grid">
<div>
<div class="card">
<h3>➕ Añadir / Editar tarea</h3>
<label>Día</label><select id="fDay"><option>LUNES</option><option>MARTES</option><option>MIÉRCOLES</option><option>JUEVES</option><option>VIERNES</option><option>SÁBADO</option><option>DOMINGO</option></select>
<label>Persona</label><select id="fPerson"></select>
<label>Zona</label><select id="fZone"><option>HABITACIÓN</option><option>COCINA</option><option>COMEDOR + BAÑO</option><option>COMEDOR</option><option>BAÑO</option></select>
<label>Detalle</label><textarea id="fText" placeholder="Ej: Plegar ropa + Ordenar ropa y zapatos + Hacer camas + Suelos limpios, barridos y fregados"></textarea>
<div class="row"><button class="btn btn-teal" onclick="saveTask()">💾 Guardar</button><button class="btn btn-ghost" onclick="clearForm()">Limpiar</button></div>
<p id="editInfo" style="font-size:13px;color:#0f766e"></p>
<h3>📝 Plantillas rápidas</h3><div id="templates"></div>
</div>

<div class="card" style="margin-top:16px">
<h3>👨‍👩‍👧 Personas</h3>
<input id="newPerson" placeholder="Ej: Gisela 16 años">
<select id="newColor"><option value="#fbcfe8">Rosa - Gisela</option><option value="#bfdbfe">Azul - José Ángel</option><option value="#bbf7d0">Verde - Erika</option><option value="#fde68a">Amarillo</option><option value="#ddd6fe">Lila</option></select>
<button class="btn btn-navy" style="width:100%" onclick="addPerson()">+ Añadir persona</button>
<div id="personsList" style="margin-top:12px"></div>
<h3 style="margin-top:16px">🏆 Ranking</h3><div id="ranking"></div>
</div>

<div class="card" style="margin-top:16px">
<h3>⚙️ Horarios y Normas</h3>
<label>Lunes a Viernes</label><input id="h1" value="17:30 - 18:00">
<label>Sábado</label><input id="h2" value="10:30 - 12:30">
<label>Domingo</label><input id="h3" value="11:00 - 11:30">
<label>Normas (una por línea)</label><textarea id="normas" rows="8"></textarea>
<button class="btn btn-teal" style="width:100%" onclick="saveConfig()">💾 Guardar horarios y normas</button>
<button class="btn btn-yellow" style="width:100%;margin-top:8px" onclick="rotar()">🔄 Rotar zonas esta semana</button>
<div class="row" style="margin-top:8px"><button class="btn btn-ghost" onclick="markAllDone()">✅ Todo hecho</button><button class="btn btn-ghost" onclick="uncheckAll()">↩ Desmarcar</button></div>
</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<div><h2 style="margin:0">CUADRANTE DE TAREAS DEL HOGAR</h2><p id="subtitle" style="margin:4px 0;color:#64748b"></p></div><span class="badge">SEMANA ACTUAL</span>
</div>

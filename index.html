<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partes - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;background:#f4f4f5;margin:0;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
h1{margin:0 0 12px} input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#111;color:#fff;border:none;font-weight:700}
.row{display:flex;gap:8px} .row button{flex:1}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700}
.ok{background:#dcfce7} .no{background:#fee2e2}
.small{font-size:13px;color:#666}
.hidden{display:none}
</style>
</head>
<body>
<h1>📋 Partes - Profe</h1>

<div id="login" class="card">
<h2>Entrar</h2>
<input id="pass" type="password" placeholder="Clave">
<button onclick="entrar()">Entrar</button>
<p class="small">Clave: Partes.123</p>
</div>

<div id="app" class="hidden">
<div class="card">
<h3>➕ Añadir alumno</h3>
<input id="nombre" placeholder="Nombre alumno">
<input id="curso" placeholder="Curso Ej: 3A">
<button onclick="addAlumno()">Añadir alumno</button>
</div>

<div class="card">
<h3>📜 Normas</h3>
<div id="normas"></div>
<input id="nuevaNorma" placeholder="Nueva norma Ej: 3 partes = sin recreo">
<button onclick="addNorma()">Añadir norma</button>
</div>

<div id="lista"></div>
<button onclick="location.reload()" style="background:#eee;color:#000">🔄 Actualizar</button>
</div>

<script>
const SUPABASE_URL = "https://semoeiilmmzfjgzqiscp.supabase.co";
const SUPABASE_KEY = "sb_publishable_SDNhqpqi0hGgJXxR1rpM2g_I6Jm1NWr";
const CLAVE = "Partes.123";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function entrar(){
  if(document.getElementById('pass').value === CLAVE){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    cargar();
  } else alert('Clave incorrecta');
}

async function cargar(){
  let {data: alumnos} = await sb.from('alumnos').select('*').order('nombre');
  let {data: normas} = await sb.from('normas').select('*').order('id');
  document.getElementById('normas').innerHTML = normas.map(n=>`<div>• ${n.texto} <button onclick="delNorma(${n.id})" style="width:auto;padding:4px 8px;background:#fee2e2;color:#000">Borrar</button></div>`).join('');
  document.getElementById('lista').innerHTML = alumnos.map(a=>`
    <div class="card">
      <b>${a.nombre}</b> <span class="small">${a.curso||''}</span><br>
      <span style="font-size:28px;font-weight:800">${a.partes||0} partes</span><br>
      <span class="badge ${a.privilegios==='TIENE'?'ok':'no'}">${a.privilegios||'TIENE'}</span>
      <div class="row">
        <button onclick="cambiarPartes(${a.id},${a.partes||0},1)" style="background:#dc2626">+1 Parte</button>
        <button onclick="cambiarPartes(${a.id},${a.partes||0},-1)" style="background:#059669">-1 Parte</button>
      </div>
      <button onclick="borrar(${a.id})" style="background:#eee;color:#000">Borrar alumno</button>
    </div>`).join('');
}

async function cambiarPartes(id, actual, delta){
  let nuevo = Math.max(0, actual + delta);
  let priv = nuevo >= 3 ? 'SIN PRIVILEGIOS' : 'TIENE';
  await sb.from('alumnos').update({partes:nuevo, privilegios:priv}).eq('id', id);
  cargar();
}
async function addAlumno(){
  let nombre=document.getElementById('nombre').value;
  let curso=document.getElementById('curso').value;
  if(!nombre) return alert('Pon nombre');
  await sb.from('alumnos').insert({nombre, curso, partes:0, privilegios:'TIENE'});
  document.getElementById('nombre').value=''; document.getElementById('curso').value='';
  cargar();
}
async function borrar(id){ if(confirm('¿Borrar?')){ await sb.from('alumnos').delete().eq('id',id); cargar(); } }
async function addNorma(){
  let t=document.getElementById('nuevaNorma').value;
  if(!t) return;
  await sb.from('normas').insert({texto:t});
  document.getElementById('nuevaNorma').value=''; cargar();
}
async function delNorma(id){ await sb.from('normas').delete().eq('id',id); cargar(); }
</script>
</body>
</html>
